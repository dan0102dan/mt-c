<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="553" viewBox="0 0 1200 553" role="img" aria-labelledby="title desc">
  <title id="title">Потребление памяти (RSS) — mt-c и MagiTrickle</title>
  <desc id="desc">Медиана, min–max трёх двадцатисекундных прогонов. Нагрузка реального роутера MT7621; UDP, 10 клиентов; логарифмические оси. Точки на 50000 и 100000 правилах остановлены защитой памяти и не измерены.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --ink: #424750;
      --muted: #6b7280;
      --axis: #59606b;
      --grid-major: #bac5d1;
      --grid-mid: #d7dee7;
      --grid-minor: #eef1f4;
      --blue: #4f73c6;
      --pale-blue: #8ea9d9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #c9cdd3;
        --muted: #a6abb3;
        --axis: #b5bac2;
        --grid-major: #505965;
        --grid-mid: #404854;
        --grid-minor: #303740;
        --blue: #4f73c6;
        --pale-blue: #c8d9fa;
      }
    }
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
    .axis-label { font-size: 17px; font-weight: 600; }
    .tick { font-size: 16px; fill: var(--ink); }
    .legend { font-size: 18px; font-weight: 600; }
    .value { font-size: 15px; font-weight: 700; }
    .axis { stroke: var(--axis); }
    .grid-major { stroke: var(--grid-major); stroke-width: 1.35; }
    .grid-mid { stroke: var(--grid-mid); stroke-width: 1.05; }
    .grid-minor { stroke: var(--grid-minor); stroke-width: 0.85; }
    .c-line { stroke: var(--blue); fill: none; }
    .go-line { stroke: var(--pale-blue); fill: none; }
    .c-point { fill: var(--blue); }
    .go-point { fill: var(--pale-blue); }
    .c-whisker { stroke: var(--blue); }
    .go-whisker { stroke: var(--pale-blue); }
  </style>
