name: PR review workspace
on:
  push:
    branches: [fix/large-subscriptions]
    paths: [.github/workflows/review-work.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify staged patch integrity
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          patch = gzip.decompress(base64.b64decode(Path('.github/review-fixes.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == '7e53646d1baf9ff8054de1c59b3445bebada022bfc510c75caf147f08e3d5325'
          print('Patch checksum verified; no repository changes applied by this job.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-patch-transport
          path: .github/review-fixes.b64
          include-hidden-files: true
          retention-days: 1
