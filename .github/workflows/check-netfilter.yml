name: Netfilter recovery regression

on:
  workflow_call:

permissions:
  contents: read


defaults:
  run:
    shell: bash

jobs:
  recovery:
    name: Recovery (legacy + nft)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install build and network-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-dev libpcre2-dev libmnl-dev libcjson-dev libcurl4-openssl-dev iptables ipset iproute2
      - name: Build recovery tests with Keenetic code enabled
        working-directory: src/backend-c
        run: make ENTWARE_KN=1 CFLAGS_EXTRA=-Werror build/host/tests/test_nfrebuild_recovery build/host/tests/test_nfcommit
      - name: Deterministic fake and fault-injection tests
        working-directory: src/backend-c
        run: |
          set -euo pipefail
          timeout 90s build/host/tests/test_nfrebuild_recovery -v 2>&1 | tee recovery-fake.log
          timeout 30s build/host/tests/test_nfcommit -v 2>&1 | tee recovery-worker.log
      - name: Real kernel recovery (iptables-legacy and iptables-nft)
        working-directory: src/backend-c
        run: |
          set -euo pipefail
          failed=0
          for frontend in legacy nft; do
            echo "::group::iptables-$frontend"
            if sudo update-alternatives --set iptables "/usr/sbin/iptables-$frontend" && \
               sudo update-alternatives --set ip6tables "/usr/sbin/ip6tables-$frontend"; then
              if sudo env MT_TEST_REAL_IPTABLES=1 unshare --net \
                  timeout 90s build/host/tests/test_nfrebuild_recovery -v 2>&1 | \
                  tee "recovery-kernel-$frontend.log"; then
                echo "Kernel recovery passed on iptables-$frontend"
              else
                failed=1
                echo "Kernel recovery FAILED on iptables-$frontend" >&2
              fi
            else
              failed=1
              echo "Unable to select iptables-$frontend" | tee "recovery-kernel-$frontend.log" >&2
            fi
            echo '::endgroup::'
          done
          exit "$failed"
      - name: Preserve failing test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: netfilter-recovery-legacy-nft
          path: src/backend-c/recovery-*.log
          retention-days: 7
