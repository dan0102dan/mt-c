name: Publish focused settings test repair
on:
  push:
    branches: [test/netfilter-fix-bootstrap-20261112]
    paths: [.github/workflows/netfilter-fix-bootstrap.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 34efffac36982795b86e8681b7cbea9af2782e83
          fetch-depth: 0
      - name: Keep only the already-tested final scenario
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/settings-refresh-minimal
          git fetch origin f070d06ea67a882cbeb948c3118f1c3bf821f213
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = 'src/frontend/tests/e2e/general-settings.spec.ts'
          base = subprocess.check_output(['git', 'show', 'HEAD:' + path]).decode()
          tested = subprocess.check_output(['git', 'show', 'f070d06ea67a882cbeb948c3118f1c3bf821f213:' + path]).decode()
          marker = 'for (const russian of [false, true]) {'
          a, b = base.rindex(marker), tested.rindex(marker)
          assert 'settings failures do not create under-tab banners' in base[a:]
          assert 'settings failures do not create under-tab banners' in tested[b:]
          assert 'await expect(attention).toBeHidden();' in tested[b:]
          assert Path(path).read_text() == base
          result = base[:a] + tested[b:]
          assert result[:a] == base[:a] and result[a:] == tested[b:]
          Path(path).write_text(result)
          PY
          git diff --check
          test "$(git diff --name-only)" = src/frontend/tests/e2e/general-settings.spec.ts
          git diff --stat
          git diff > /tmp/settings-refresh-minimal/fix.patch
          branch=test/settings-refresh-minimal-20261112
          if git ls-remote --exit-code --heads origin "refs/heads/$branch"; then
            echo 'Refusing to replace an existing branch' >&2; exit 1
          fi
          git config user.name dan0102dan
          git config user.email me@dan0102dan.ru
          git add src/frontend/tests/e2e/general-settings.spec.ts
          git commit -m 'test: exercise explicit settings refresh failures and recovery'
          git rev-parse HEAD | tee /tmp/settings-refresh-minimal/commit.txt
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: settings-refresh-minimal
          path: /tmp/settings-refresh-minimal/
          retention-days: 7
