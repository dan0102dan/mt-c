name: Collect original CI diagnostics
on:
  push:
    branches: [test/netfilter-fix-bootstrap-20261112]
    paths: [.github/workflows/netfilter-fix-bootstrap.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect failed static-analysis diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original-ci-diagnostics
          for job in 131180071998 131180072308; do
            gh api "repos/dan0102dan/mt-c/actions/jobs/$job/logs" > "/tmp/job-$job.log"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          pattern = re.compile(r'warning:|error:|warning treated|Error [0-9]|error generated|clang-tidy|clang-analyzer', re.I)
          for job in [131180071998, 131180072308]:
              raw = Path(f'/tmp/job-{job}.log').read_text(encoding='utf-8-sig')
              lines = raw.splitlines()
              hits = [i for i,s in enumerate(lines) if pattern.search(s)]
              selected = set()
              for i in hits:
                  selected.update(range(max(0,i-8),min(len(lines),i+30)))
              result = '\n'.join(f'{i+1}: {lines[i]}' for i in sorted(selected))
              Path(f'/tmp/original-ci-diagnostics/job-{job}.txt').write_text(result+'\n')
              print(f'{job}: {len(lines)} log lines; {len(selected)} diagnostic context lines')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: original-ci-diagnostics
          path: /tmp/original-ci-diagnostics/
          retention-days: 7
