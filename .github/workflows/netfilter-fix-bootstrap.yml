name: Validate non-destructive netfilter fix
on:
  push:
    branches: [test/netfilter-fix-bootstrap-20261112]
    paths: [.github/workflows/netfilter-fix-bootstrap.yml]
permissions:
  contents: write
concurrency:
  group: validate-netfilter-fix-20261112
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact locally tested candidate to pinned base
        run: |
          set -euo pipefail
          mkdir -p /tmp/netfilter-fix-results
          cp .github/netfilter-code.patch .github/netfilter-tests.patch /tmp/
          printf '%s\n' \
            '1b186bfb0ffbb2b5929979a1c142427b114597b4fe624f5ff771f9e0b1cad6b1  /tmp/netfilter-code.patch' \
            'adb37b13ff10882a634049b72828ac68d2191944c98e8293dd21cbb524b41d55  /tmp/netfilter-tests.patch' | sha256sum -c -
          git checkout --detach e5be3e4fd788b411dc182a6b5f6504b58c571e39
          git apply --check /tmp/netfilter-code.patch /tmp/netfilter-tests.patch
          git apply /tmp/netfilter-code.patch /tmp/netfilter-tests.patch
          git diff --check
          git diff --stat | tee /tmp/netfilter-fix-results/changes.txt
          git diff --binary > /tmp/netfilter-fix-results/fix.patch
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential \
            libyaml-dev libcjson-dev libpcre2-dev libmnl-dev libcurl4-openssl-dev \
            iptables ipset iproute2
      - name: Targeted regressions and worker burst tests
        run: |
          set -euo pipefail
          make -C src/backend-c -j2 BUILD=fix-kn ENTWARE_KN=1 CFLAGS_EXTRA=-Werror \
            build/fix-kn/tests/test_nfrebuild_recovery build/fix-kn/tests/test_nfcommit \
            build/fix-kn/tests/test_iptables
          for test in test_nfrebuild_recovery test_nfcommit test_iptables; do
            timeout 90s src/backend-c/build/fix-kn/tests/$test -v \
              2>&1 | tee /tmp/netfilter-fix-results/$test.log
          done
      - name: Real legacy and nft kernel regressions
        run: |
          set -euo pipefail
          for backend in legacy nft; do
            sudo update-alternatives --set iptables /usr/sbin/iptables-$backend
            sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-$backend
            sudo unshare --net env MT_TEST_REAL_IPTABLES=1 \
              timeout 90s src/backend-c/build/fix-kn/tests/test_nfrebuild_recovery -v \
              2>&1 | tee /tmp/netfilter-fix-results/kernel-$backend.log
          done
      - name: Negative control against unmodified production code
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/mtc-netfilter-before e5be3e4fd788b411dc182a6b5f6504b58c571e39
          cp src/backend-c/tests/unit/test_nfrebuild_recovery.c /tmp/mtc-netfilter-before/src/backend-c/tests/unit/
          make -C /tmp/mtc-netfilter-before/src/backend-c -j2 ENTWARE_KN=1 CFLAGS_EXTRA=-Werror \
            build/host/tests/test_nfrebuild_recovery
          set +e
          sudo unshare --net env MT_TEST_REAL_IPTABLES=1 timeout 90s \
            /tmp/mtc-netfilter-before/src/backend-c/build/host/tests/test_nfrebuild_recovery \
            -v -t cancellation_preserves_active_chains \
            > /tmp/netfilter-fix-results/negative-control.log 2>&1
          result=$?
          set -e
          cat /tmp/netfilter-fix-results/negative-control.log
          test "$result" = 1
          grep -q 'fail: 2' /tmp/netfilter-fix-results/negative-control.log
          echo 'PASS: both cancellation-preservation regressions reject the unchanged baseline'
      - name: Full generic and Keenetic unit suites
        run: |
          set -euo pipefail
          for variant in generic keenetic; do
            kn=0; test "$variant" != keenetic || kn=1
            timeout 600s make -C src/backend-c -j2 BUILD=full-$variant ENTWARE_KN=$kn \
              CFLAGS_EXTRA=-Werror all test \
              > /tmp/netfilter-fix-results/full-$variant.log 2>&1 || {
                tail -n 100 /tmp/netfilter-fix-results/full-$variant.log; exit 1;
              }
            tail -n 30 /tmp/netfilter-fix-results/full-$variant.log
          done
      - name: Full ASan and UBSan suites
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          for variant in generic keenetic; do
            kn=0; test "$variant" != keenetic || kn=1
            timeout 600s make -C src/backend-c -j2 BUILD=san-$variant ENTWARE_KN=$kn \
              CFLAGS_EXTRA=-Werror \
              OPT='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie' \
              LDFLAGS='-fsanitize=address,undefined -no-pie' test \
              > /tmp/netfilter-fix-results/sanitize-$variant.log 2>&1 || {
                tail -n 100 /tmp/netfilter-fix-results/sanitize-$variant.log; exit 1;
              }
            tail -n 30 /tmp/netfilter-fix-results/sanitize-$variant.log
          done
      - name: Publish validated fix branch without changing production branches
        run: |
          set -euo pipefail
          branch=fix/non-destructive-netfilter-rebuild-20261112
          test "$(git rev-parse HEAD)" = e5be3e4fd788b411dc182a6b5f6504b58c571e39
          git diff --check
          if git ls-remote --exit-code --heads origin "refs/heads/$branch"; then
            echo 'Refusing to replace an existing branch' >&2; exit 1
          fi
          git config user.name dan0102dan
          git config user.email me@dan0102dan.ru
          git add src/backend-c/src/api/app.c src/backend-c/src/iptables/engine.c \
            src/backend-c/src/netfilter/committer.c \
            src/backend-c/include/magitrickle/iptables.h src/backend-c/include/magitrickle/nfcommit.h \
            src/backend-c/tests/unit/test_iptables.c src/backend-c/tests/unit/test_nfcommit.c \
            src/backend-c/tests/unit/test_nfrebuild_recovery.c \
            docs/c-rewrite/decisions.md docs/c-rewrite/compatibility-contract.md \
            .github/workflows/check-netfilter.yml
          git commit -m 'fix: preserve live netfilter rules across rebuild cancellation'
          git rev-parse HEAD | tee /tmp/netfilter-fix-results/fix-commit.txt
          git bundle create /tmp/netfilter-fix-results/fix.bundle HEAD ^e5be3e4fd788b411dc182a6b5f6504b58c571e39
          git push origin "HEAD:refs/heads/$branch"
      - name: Preserve results and exact patch
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: netfilter-fix-validation-${{ github.run_attempt }}
          path: /tmp/netfilter-fix-results/
          if-no-files-found: error
          retention-days: 7
