name: Publish policy rollback synchronization fix
on:
  push:
    branches: [refactor/system-integration-audit]
    paths: [.github/workflows/audit-lock-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply exact tested change and remove helper
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          def git(*args, **kw):
              return subprocess.run(['git', *args], check=True, **kw)
          git('diff', '--exit-code', '0c93f683dfba806cd3fd85c1816398ec06416df8', '--', 'src/backend-c', 'tools/tests')
          path = Path('src/backend-c/src/api/app.c')
          source = path.read_text()
          declarations = '    const mt_kn_policy_scope_t old_desired = app->policy_desired;\n    const mt_kn_policy_scope_t old_scope = app->policy_scope;\n    bool policy_touched = false;\n'
          anchor = '    size_t ng = next.n_groups, ns = next.n_subscriptions;\n    app_nf_enter(app);\n'
          assert source.count(declarations) == 1 and source.count(anchor) == 1
          source = source.replace(declarations, '')
          source = source.replace(anchor, anchor + '#ifdef MT_ENTWARE_KN\n    /* The committer publishes policy_scope under nf_mu. Capture rollback\n     * state only after excluding that writer, like the registries below. */\n' + declarations + '#endif\n')
          path.write_text(source)
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('add', str(path))
          git('rm', '.github/workflows/audit-lock-fix.yml')
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '1928016fbbbbadebb0f23387c403be9f8ab372e4', tree
          git('commit', '-m', 'fix(config): capture policy rollback state under the committer lock')
          git('push', 'origin', 'HEAD:refactor/system-integration-audit')
          print('Published tested tree:', tree)
          PY
