name: Publish verified large-rule fixes
on:
  push:
    branches: [fix/large-subscriptions]
    paths: [.github/workflows/apply-large-rules.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'dan0102dan/mt-c' && github.ref == 'refs/heads/fix/large-subscriptions'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify source and patch integrity
        run: |
          set -eu
          git diff --exit-code 724ebc1f498ff45f109412b3984964755c4f0115 HEAD -- src docs tools config Makefile AGENTS.md
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/large-rules-patch/{i}.b64').read_text().strip() for i in range(1, 7))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = 'ed3f6e2dd555bb0e7a1851062ac66e774a577185f3b8743107fd253c7ceace61'
          assert hashlib.sha256(patch).hexdigest() == expected, 'patch integrity mismatch'
          paths = []
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  path = line[6:]
                  assert path.startswith(('src/', 'tools/bench/', 'docs/c-rewrite/')) and '..' not in Path(path).parts
                  paths.append(path)
          assert len(paths) == 41, len(paths)
          Path('/tmp/large-rules.patch').write_bytes(patch)
          print(f'Verified {len(paths)} files; patch SHA256 {expected}')
          PY
          git apply --check --unidiff-zero /tmp/large-rules.patch
      - name: Commit to feature branch only
        run: |
          set -eu
          git apply --unidiff-zero /tmp/large-rules.patch
          git rm .github/large-rules-patch/*.b64 .github/workflows/apply-large-rules.yml .github/workflows/large-subscription-dev.yml
          git add src docs/c-rewrite tools/bench/large-rules.c
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix large groups and subscriptions: indexed processing, worker parsing and compact saves' -m 'Preserve IDs and rule state; stage group replacement before applying; bound large HTTP bodies; return persistence failures. Add 50k-rule parser, HTTP, group, subscription and UI regression coverage. Remove temporary patch transport and development workflows.'
          git push origin HEAD:refs/heads/fix/large-subscriptions
          git rev-parse HEAD
