name: Audit workspace snapshot
on:
  push:
    branches: [refactor/system-integration-audit]
    paths: [.github/workflows/audit-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare source and public development headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libyaml-dev libcjson-dev libmnl-dev
          mkdir -p /tmp/audit-workspace
          git archive --format=tar HEAD | gzip > /tmp/audit-workspace/source.tar.gz
          tar -czf /tmp/audit-workspace/headers.tar.gz -C /usr/include yaml.h cjson libmnl
      - uses: actions/upload-artifact@v4
        with:
          name: audit-workspace
          path: /tmp/audit-workspace/
          retention-days: 1
