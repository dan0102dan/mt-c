name: DNS review workspace
on:
  push:
    branches: [feat/dns-query-log]
    paths: [.github/workflows/dns-review-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install locked frontend development dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Package tracked source and development tools
        run: |
          set -eu
          mkdir -p /tmp/dns-review-workspace
          git archive --format=tar.gz HEAD > /tmp/dns-review-workspace/head.tar.gz
          git rev-parse HEAD > /tmp/dns-review-workspace/head.txt
          tar -czf /tmp/dns-review-workspace/frontend-deps.tar.gz -C src/frontend node_modules
          cp "$(command -v deno)" /tmp/dns-review-workspace/deno
      - uses: actions/upload-artifact@v4
        with:
          name: dns-review-workspace-current
          path: /tmp/dns-review-workspace
          retention-days: 1
          if-no-files-found: error
