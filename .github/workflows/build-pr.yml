# Safe opt-in package preview: trusted dispatch and publication, untrusted PR
# compilation with a read-only token through the shared SDK workflow.
name: Build PR packages
run-name: 'PR #${{ inputs.pr_number }} / ${{ inputs.platform }} / ${{ inputs.architecture }}'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number, e.g. 26'
        type: string
        required: true
      platform:
        description: 'Router package family'
        type: choice
        required: true
        default: entware
        options: [entware, openwrt]
      architecture:
        description: 'Name of config/<platform>/<architecture>.config'
        type: string
        required: true
        default: mipsel-3.4_kn
      openwrt_version:
        description: 'OpenWrt version (ignored for Entware)'
        type: choice
        required: true
        default: '25.12.5'
        options: ['24.10.4', '25.12.5', snapshot]
      publish_prerelease:
        description: 'Publish test prerelease with direct package URL'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  resolve:
    name: Pin PR head commit
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.ref.outputs.pr }}
      sha: ${{ steps.ref.outputs.sha }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - name: Validate the requested PR
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.architecture }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid PR number"; exit 1; }
          [[ "$PLATFORM" == entware || "$PLATFORM" == openwrt ]] || exit 1
          [[ "$ARCH" =~ ^[a-zA-Z0-9._+-]+$ ]] || { echo "::error::Invalid architecture"; exit 1; }
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          if [ "$GITHUB_REF" != "refs/heads/$default_branch" ]; then
            echo "::error::Choose the repository default branch in Run workflow. The PR is selected by number, not by running its workflow YAML."
            exit 1
          fi
          data=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          [ "$(jq -r '.state' <<<"$data")" = open ] || { echo "::error::PR #$PR must be open"; exit 1; }
          sha=$(jq -r '.head.sha' <<<"$data")
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          short=$(printf '%.12s' "$sha")
          {
            echo "pr=$PR"
            echo "sha=$sha"
            echo "tag=pr-$PR-$short-$GITHUB_RUN_ID"
          } >> "$GITHUB_OUTPUT"
          echo "PR #$PR pinned to $sha"

  build:
    name: Compile requested SDK package
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      pr_number: ${{ needs.resolve.outputs.pr }}
      source_sha: ${{ needs.resolve.outputs.sha }}
      platform: ${{ inputs.platform }}
      architecture: ${{ inputs.architecture }}
      openwrt_version: ${{ inputs.openwrt_version }}

  publish:
    name: Optional test prerelease
    needs: [resolve, build]
    if: ${{ inputs.publish_prerelease && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Release only this run's package under a unique test tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PR: ${{ needs.resolve.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packages"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'mt-c_*' --dir "$RUNNER_TEMP/packages"
          package_count=$(find "$RUNNER_TEMP/packages" -type f \
            \( -name 'mt-c_*.apk' -o -name 'mt-c_*.ipk' \) | wc -l)
          [ "$package_count" -eq 1 ] || { echo "::error::Expected exactly one package"; exit 1; }
          package=$(find "$RUNNER_TEMP/packages" -type f \
            \( -name 'mt-c_*.apk' -o -name 'mt-c_*.ipk' \) -print -quit)
          filename=$(basename "$package")
          (cd "$(dirname "$package")" && sha256sum "$filename" > "$filename.sha256")
          gh release create "$TAG" "$package" "$package.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease --latest=false \
            --title "TEST PR #$PR ($SHA)" \
            --notes "Unstable preview for PR #$PR from pinned commit $SHA. This is not a stable release or an update-feed target."

  report:
    name: Post PR build links
    needs: [resolve, build, publish]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Add links to one updated PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
          SHA: ${{ needs.resolve.outputs.sha }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISH_REQUESTED: ${{ inputs.publish_prerelease }}
          PLATFORM: ${{ inputs.platform }}
          ARCH: ${{ inputs.architecture }}
          OPENWRT_VERSION: ${{ inputs.openwrt_version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("mt-c_")) | .name' | head -1)
          url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          release="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          comment="$RUNNER_TEMP/build-comment.md"
          cat > "$comment" <<'EOF'
          <!-- mt-c-manual-pr-package -->
          ### Latest requested test package
          EOF
          {
            printf '\n| Property | Value |\n|---|---|\n'
            printf '| PR | #%s |\n' "$PR"
            printf '| Commit | %s |\n' "$SHA"
            printf '| Platform | %s / %s |\n' "$PLATFORM" "$ARCH"
            [ "$PLATFORM" != openwrt ] || printf '| OpenWrt | %s |\n' "$OPENWRT_VERSION"
            printf '| Build | **%s** — [CI run](%s) |\n' "$RESULT" "$url"
            [ -z "$artifact_name" ] || printf '| Artifact | %s — [download via Actions](%s) |\n' "$artifact_name" "$url"
            if [ "$PUBLISH_REQUESTED" = true ]; then
              printf '| Test prerelease | **%s**' "$PUBLISH_RESULT"
              [ "$PUBLISH_RESULT" != success ] || printf ' — [files](%s)' "$release"
              printf ' |\n'
            fi
            if [ "$RESULT" != success ]; then
              printf '\n**Unverified:** the build or an integration test failed. Artifacts are diagnostic only.\n'
            else
              printf '\nSDK package build and required checks passed for this target only.\n'
            fi
            if [ "$PUBLISH_RESULT" = success ] && [ -n "$artifact_name" ]; then
              direct="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$artifact_name"
              printf '\nInstall from the router after checking compatibility:\n'
              printf '%s\n' '```sh'
              if [ "$PLATFORM" = entware ] || [ "$OPENWRT_VERSION" = 24.10.4 ]; then
                printf 'wget -O /tmp/mt-c-test.ipk "%s"\nopkg install /tmp/mt-c-test.ipk\n' "$direct"
              else
                printf 'wget -O /tmp/mt-c-test.apk "%s"\napk add --allow-untrusted /tmp/mt-c-test.apk\n' "$direct"
              fi
              printf '%s\n' '```'
            fi
            printf '\nTest builds are not distributed through the official update feed.\n'
          } >> "$comment"
          cat "$comment" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- mt-c-manual-pr-package -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              --raw-field "body=$(cat "$comment")" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              --raw-field "body=$(cat "$comment")" > /dev/null
          fi
