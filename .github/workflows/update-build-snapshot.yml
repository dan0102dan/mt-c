name: Validate simplified system updater
on:
  push:
    branches: [refactor/system-package-update]
    paths: [.github/workflows/update-build-snapshot.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpcre2-dev libyaml-dev libmnl-dev libcjson-dev libcurl4-openssl-dev python3-yaml
          mkdir -p "$RUNNER_TEMP/result" "$RUNNER_TEMP/before"
      - name: Measure baseline with the same compiler
        run: |
          git archive HEAD src/backend-c | tar -x -C "$RUNNER_TEMP/before"
          make -C "$RUNNER_TEMP/before/src/backend-c" -j4 CFLAGS_EXTRA=-Werror
          strip -o "$RUNNER_TEMP/result/before-daemon" "$RUNNER_TEMP/before/src/backend-c/build/host/magitrickled-c"
          strip -o "$RUNNER_TEMP/result/before-updater" "$RUNNER_TEMP/before/src/backend-c/build/host/mt-c-updater"
      - name: Apply hash-verified source edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path.cwd()
          repo = os.environ['GITHUB_REPOSITORY']
          chunks = ['d9c61d13ff137d8c50e942adfc244a77adcdbbca', '9af002235909dbe9abc0d63a649cdcea785829f4', 'd02468fb2bcc9e6475533700a0a232939439f85a', '4c16e663fa74a8b92e76278e0879797f08d36b25']
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def get_blob(sha):
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'mt-c-validation'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  obj = json.load(response)
              data = base64.b64decode(obj['content'])
              assert blob_hash(data) == sha
              return data
          raw = gzip.decompress(b''.join(get_blob(sha) for sha in chunks))
          assert hashlib.sha256(raw).hexdigest() == '6f584d68d65c8f29bcb79437e398d8aba9f7bb80f87549da67ef787069716d5b'
          edits = json.loads(raw)
          assert len(edits) == 22
          for edit in edits:
              path = root / edit['path']
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              old = path.read_bytes()
              assert blob_hash(old) == edit['old_sha'], edit['path']
              if edit.get('delete'):
                  path.unlink()
              else:
                  lines = old.decode().splitlines(keepends=True)
                  for start, end, replacement in reversed(edit['edits']):
                      lines[start:end] = replacement.splitlines(keepends=True)
                  new = ''.join(lines).encode()
                  assert blob_hash(new) == edit['new_sha'], edit['path']
                  path.write_bytes(new)
              print(edit['path'])
          pathlib.Path(os.environ['RUNNER_TEMP'], 'edits.json').write_bytes(raw)
          # This staging workflow is deliberately absent from the final change.
          (root / '.github/workflows/update-build-snapshot.yml').unlink()
          PY
          git diff --check
      - name: Build and run all native unit tests
        run: |
          make -C src/backend-c -j4 CFLAGS_EXTRA=-Werror
          test ! -e src/backend-c/build/host/mt-c-updater
          make -C src/backend-c -j4 test
          strip -o "$RUNNER_TEMP/result/after-daemon" src/backend-c/build/host/magitrickled-c
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'result')
          sizes = {name: (root / name).stat().st_size for name in ['before-daemon', 'before-updater', 'after-daemon']}
          (root / 'sizes.json').write_text(json.dumps(sizes, indent=2))
          print(sizes)
          PY
      - name: Sanitizers for update process and release boundaries
        run: |
          make -C src/backend-c -j4 BUILD=update-sanitize OPT='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address,undefined' build/update-sanitize/tests/test_update_process build/update-sanitize/tests/test_update_release
          ASAN_OPTIONS=detect_leaks=1 src/backend-c/build/update-sanitize/tests/test_update_process
          ASAN_OPTIONS=detect_leaks=1 src/backend-c/build/update-sanitize/tests/test_update_release
      - name: Package contracts and API YAML
        run: |
          python3 tools/tests/package_identity.py
          python3 - <<'PY'
          import yaml
          with open('docs/swagger.yaml') as stream:
              spec = yaml.safe_load(stream)
          for suffix in ['', '/status', '/install']:
              assert '/api/v1/system/update' + suffix in spec['paths']
          assert spec['definitions']['types.UpdateStatusRes']['properties']['external']['type'] == 'boolean'
          print('Swagger update routes and volatile status schema OK')
          PY
      - name: Frontend dependencies and browser
        working-directory: src/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Frontend typecheck, build and unit tests
        working-directory: src/frontend
        run: |
          npm run check
          npm run build
          npm run test:unit
      - name: Update and header browser regression tests
        working-directory: src/frontend
        run: npx playwright test tests/e2e/header.spec.ts tests/e2e/updates-recovery.spec.ts --workers=2
      - name: Create tested commit without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          parent = os.environ['GITHUB_SHA']
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path, data=None if data is None else json.dumps(data).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'mt-c-validation'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          entries = []
          edits = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'edits.json').read_text())
          for edit in edits:
              path = pathlib.Path(edit['path'])
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', str(path)], text=True).split()[0]
              sha = None
              if not edit.get('delete'):
                  data = path.read_bytes()
                  assert blob_hash(data) == edit['new_sha'], str(path)
                  sha = api('/git/blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})['sha']
                  assert sha == edit['new_sha']
              entries.append({'path': str(path), 'mode': mode, 'type': 'blob', 'sha': sha})
          entries.append({'path': '.github/workflows/update-build-snapshot.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          base = api('/git/commits/' + parent)['tree']['sha']
          tree = api('/git/trees', {'base_tree': base, 'tree': entries})['sha']
          commit = api('/git/commits', {'tree': tree, 'parents': [parent], 'message': 'refactor: hand WebUI updates to the system package manager\n\nPrepare and verify in the existing daemon, then run a detached fixed system\nshell command for opkg/apk and the normal service restart. Remove the\nsecond executable and application-owned update journals/backups. Confirm\nthe running version from WebUI after restart; preserve visual changes.\n\nDocument D-75 and cover handoff survival, lock/descriptor isolation,\npackage cleanup, volatile status, restart confirmation and package contents.'})['sha']
          result = {'commit': commit, 'tree': tree, 'parent': parent, 'files': len(edits), 'ref_updated': False}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'result', 'commit.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result))
          PY
      - name: Publish validation metadata and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-package-update-validation
          path: |
            ${{ runner.temp }}/result/*.json
            src/frontend/test-results
            src/frontend/playwright-report
          retention-days: 3
