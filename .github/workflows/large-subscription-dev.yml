name: Large subscription development snapshot
on:
  push:
    branches: [fix/large-subscriptions]
    paths: [.github/workflows/large-subscription-dev.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Prepare isolated frontend test dependencies
        working-directory: src/frontend
        run: |
          npm ci
          tar -czf ../../frontend-deps.tar.gz node_modules
      - uses: actions/upload-artifact@v6
        with:
          name: large-subscription-frontend-deps
          path: frontend-deps.tar.gz
          retention-days: 1
