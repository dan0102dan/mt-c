name: Checking package contracts
on:
  pull_request:
    paths:
      - 'Makefile'
      - 'files/**'
      - 'tools/ci/**'
      - 'tools/tests/package_identity.py'
      - 'tools/tests/frontend_variants.py'
      - '.github/workflows/check-packaging.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-pr.yml'
  push:
    paths:
      - 'Makefile'
      - 'files/**'
      - 'tools/ci/**'
      - 'tools/tests/package_identity.py'
      - 'tools/tests/frontend_variants.py'
      - '.github/workflows/check-packaging.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/build-pr.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/tests/package_identity.py
      - name: Check frontend build cache isolation
        run: python3 tools/tests/frontend_variants.py
      - name: Test SDK acquisition and source fallback
        run: python3 tools/ci/tests/test_openwrt_sdk.py
      - name: Test router-emulator orchestration
        run: python3 tools/ci/tests/test_router_emulator_smoke.py
      - name: Test PR package target-selection and release boundaries
        run: python3 tools/ci/tests/test_build_matrix.py
