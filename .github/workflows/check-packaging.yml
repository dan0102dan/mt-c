name: Checking package contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  metadata:
    name: Package and benchmark contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/bench/go.mod
          cache-dependency-path: tools/bench/go.sum
      - run: python3 tools/tests/package_identity.py
      - name: Test Entware registry authentication
        run: python3 tools/ci/tests/test_ghcr_login.py
      - name: Test CI orchestration and emulator gating
        run: python3 tools/ci/tests/test_ci_orchestration.py
      - name: Test Entware packaged install hooks
        run: python3 tools/ci/tests/test_entware_ipk.py
      - name: Test Keenetic service restart failures
        run: python3 tools/ci/tests/test_entware_init.py
      - name: Check frontend build cache isolation
        run: python3 tools/tests/frontend_variants.py
      - name: Test SDK acquisition and source fallback
        run: python3 tools/ci/tests/test_openwrt_sdk.py
      - name: Test router-emulator package-manager orchestration
        run: python3 tools/ci/tests/test_router_emulator.py
      - name: Test package upgrade fixture generation
        run: python3 tools/ci/tests/test_upgrade_fixture.py
      - name: Test Router Emulator preset and flash preparation
        run: python3 tools/ci/tests/test_router_emulator_preset.py
      - name: Test Router Emulator host runtime compatibility and same-release rebuild
        run: python3 tools/ci/tests/test_router_emulator_runtime.py
      - name: Test automatic latest-stable release selection and SHA256 checks
        run: python3 tools/ci/tests/test_router_emulator_release.py
      - name: Test fresh source staging for package comparisons
        run: python3 tools/ci/tests/test_build_emulator_package.py
      - name: Test DNS comparison correctness gates
        run: python3 tools/ci/tests/test_router_emulator_compare.py
      - name: Test rules comparison result gates
        run: python3 tools/bench/tests/test_rules_reconcile_compare.py
      - name: Test DNS benchmark helpers
        working-directory: tools/bench
        run: go test ./dnsload ./dnsstub ./dnsquery
