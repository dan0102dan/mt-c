definitions:
  types.AdaptiveSettings:
    type: object
    additionalProperties: false
    required: [enabled, interface, ingressInterfaces, connectTimeoutMs, tlsTimeoutMs, idleTimeoutMs, ttlSeconds, maxConnections, maxEntries]
    description: >-
      Complete replacement of the original nine settings, with two optional
      scope flags. Missing tcpAllPorts or quicEnabled defaults to false;
      responses always include both. Existing web-only settings retain their scope.
    properties:
      enabled: {type: boolean, default: false}
      tcpAllPorts:
        type: boolean
        default: false
        description: Intercept TCP ports 1–65535. Additional ports support connect-stage fallback; TLS ClientHello retry remains limited to TCP/443.
      quicEnabled:
        type: boolean
        default: false
        description: Intercept UDP/443 with bounded QUIC v1/v2 Initial-only fallback before any server reply. Other UDP ports are untouched; opaque UDP/443 is relayed on one path without retry or learning.
      interface:
        type: string
        maxLength: 15
        description: Alternate Linux interface; required and must exist when enabled. Not a routing profile.
        example: vpn0
      ingressInterfaces:
        type: array
        maxItems: 16
        uniqueItems: true
        items: {type: string, minLength: 1, maxLength: 15}
        description: Explicit LAN ingress interfaces; at least one when enabled, distinct from the alternate interface.
      connectTimeoutMs:
        type: integer
        minimum: 100
        maximum: 60000
        default: 2000
        description: TCP connect budget per attempt and initial QUIC direct-path response budget, in milliseconds.
      tlsTimeoutMs: {type: integer, minimum: 100, maximum: 60000, default: 3000}
      idleTimeoutMs: {type: integer, minimum: 1000, maximum: 3600000, default: 300000}
      ttlSeconds: {type: integer, minimum: 30, maximum: 86400, default: 600}
      maxConnections:
        type: integer
        minimum: 1
        maximum: 1024
        default: 128
        description: Shared active relay limit across TCP connections and UDP flows.
      maxEntries: {type: integer, minimum: 1, maximum: 65536, default: 2048}
  types.AdaptiveState:
    type: object
    required: [settings, active, error, interfaces, entries, stats]
    properties:
      settings: {$ref: '#/definitions/types.AdaptiveSettings'}
      active:
        type: boolean
        description: Listener and kernel interception were activated; not a guarantee of Internet reachability.
      error: {type: string, x-nullable: true}
      code:
        type: string
        enum: [INVALID_SETTINGS, SETTINGS_BUSY, TPROXY_UNAVAILABLE, PERSISTENCE_FAILED, CACHE_UNAVAILABLE]
      applied:
        type: boolean
        description: True on persistence failure when the returned settings are already applied. Retry the same settings to save without restarting flows.
      interfaces:
        type: array
        items:
          type: object
          required: [id, name]
          properties:
            id: {type: string}
            name: {type: string}
      entries:
        type: array
        items:
          type: object
          required: [address, family, protocol, port, alternate, expiresInSeconds]
          properties:
            address: {type: string}
            family: {type: integer, enum: [4, 6]}
            protocol: {type: string, enum: [tcp, udp]}
            port:
              type: integer
              minimum: 1
              maximum: 65535
              description: TCP destination port, or 443 for UDP. Protocol is part of the cache key.
            alternate: {type: boolean}
            expiresInSeconds: {type: integer, minimum: 0}
      stats:
        type: object
        description: Aggregated TCP and UDP relay counters only; connections following learned kernel routes do not increase these counters. Success records observed transport progress, not certificate validation or completed page loading.
        required: [active, accepted, directSuccess, alternateSuccess, failures, overLimit]
        properties:
          active: {type: integer, minimum: 0}
          accepted: {type: integer, format: int64, minimum: 0}
          directSuccess: {type: integer, format: int64, minimum: 0}
          alternateSuccess: {type: integer, format: int64, minimum: 0}
          failures: {type: integer, format: int64, minimum: 0}
          overLimit:
            type: integer
            format: int64
            minimum: 0
            description: Admission pauses at the connection limit, not an exact count of rejected clients.
  types.ErrorRes:
    properties:
      error:
        example: something went wrong
        type: string
    type: object
  types.GroupReq:
    properties:
      color:
        example: '#ffffff'
        type: string
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      interface:
        example: nwg0
        type: string
      name:
        example: Routing
        type: string
      priority:
        description: Higher values take precedence when routing. Omission uses 300 for a new group and preserves the current value when updating an existing group.
        type: integer
        minimum: 1
        maximum: 999
        default: 300
        example: 300
      rules:
        items:
          $ref: '#/definitions/types.RuleReq'
        type: array
    type: object
  types.GroupRes:
    properties:
      color:
        example: '#ffffff'
        type: string
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      interface:
        example: nwg0
        type: string
      name:
        example: Routing
        type: string
      priority:
        description: Routing priority; higher values take precedence.
        type: integer
        minimum: 1
        maximum: 999
        example: 300
      rules:
        items:
          $ref: '#/definitions/types.RuleRes'
        type: array
    type: object
  types.GroupsReq:
    properties:
      groups:
        items:
          $ref: '#/definitions/types.GroupReq'
        type: array
    type: object
  types.GroupsRes:
    properties:
      groups:
        items:
          $ref: '#/definitions/types.GroupRes'
        type: array
    type: object
  types.InterfaceRes:
    properties:
      id:
        example: nwg0
        type: string
    type: object
  types.InterfacesRes:
    properties:
      interfaces:
        items:
          $ref: '#/definitions/types.InterfaceRes'
        type: array
    type: object
  types.NetfilterDHookReq:
    properties:
      action:
        description: >-
          notify retains the legacy re-commit and 200 acknowledgement; Keenetic
          queues the rebuild, while other platforms commit synchronously.
          status only checks whether local routing is applied and
          returns 204 when ready or 503 while pending. Omission keeps the
          legacy notification behavior. Unknown or non-string actions are
          rejected without queuing a rebuild.
        type: string
        enum: [notify, status]
        default: notify
      table:
        description: Firmware event metadata; ignored by the status action.
        example: nat
        type: string
      type:
        description: Firmware event metadata; ignored by the status action.
        example: iptables
        type: string
    type: object
  types.SettingsEndpoint:
    type: object
    additionalProperties: false
    required: [address, port]
    properties:
      address: {type: string, minLength: 1, example: '[::]'}
      port: {type: integer, minimum: 1, maximum: 65535}
  types.GeneralSettings:
    type: object
    additionalProperties: false
    required: [httpWeb, dnsProxy, netfilter, link, showAllInterfaces, logLevel]
    description: >-
      The complete editable application settings projection. Collection data,
      Keenetic policy, skin, chain/table prefixes and mark-table index are not
      accepted here and are preserved from the latest running configuration.
    properties:
      httpWeb:
        type: object
        additionalProperties: false
        required: [enabled, auth, host]
        properties:
          enabled: {type: boolean}
          auth:
            type: object
            additionalProperties: false
            required: [enabled]
            properties:
              enabled: {type: boolean}
          host: {$ref: '#/definitions/types.SettingsEndpoint'}
      dnsProxy:
        type: object
        additionalProperties: false
        required: [host, upstream, disableRemap53, disableFakePTR, disableDropAAAA, maxIdleConns, maxConcurrent, timeoutMs]
        properties:
          host: {$ref: '#/definitions/types.SettingsEndpoint'}
          upstream: {$ref: '#/definitions/types.SettingsEndpoint'}
          disableRemap53: {type: boolean}
          disableFakePTR: {type: boolean}
          disableDropAAAA: {type: boolean}
          maxIdleConns: {type: integer, minimum: 0, maximum: 4294967295}
          maxConcurrent: {type: integer, minimum: 1, maximum: 4294967295}
          timeoutMs:
            type: integer
            minimum: 1
            maximum: 4294967295
            description: Upstream request timeout in milliseconds.
      netfilter:
        type: object
        additionalProperties: false
        required: [disableIPv4, disableIPv6, ipset]
        properties:
          disableIPv4: {type: boolean}
          disableIPv6: {type: boolean}
          ipset:
            type: object
            additionalProperties: false
            required: [additionalTTLSeconds]
            properties:
              additionalTTLSeconds:
                type: integer
                minimum: 0
                maximum: 4294967295
                description: Extra lifetime added to DNS-derived IP entries, in seconds.
      link:
        type: array
        uniqueItems: true
        description: Interface names used to collect local addresses for DNS port interception.
        items: {type: string, minLength: 1}
      showAllInterfaces: {type: boolean}
      logLevel:
        type: string
        enum: [trace, debug, info, warn, error, fatal, panic, nolevel, disabled]
  types.SettingsOperation:
    type: object
    required: [id, state, target_revision]
    properties:
      id: {type: string}
      state:
        type: string
        enum: [applying, succeeded, failed, rollback_failed]
      target_revision: {type: string}
      error: {type: string}
  types.SettingsSnapshot:
    type: object
    required: [settings, revision, operation]
    properties:
      settings: {$ref: '#/definitions/types.GeneralSettings'}
      revision:
        type: string
        description: Opaque revision over the editable application settings only.
      operation:
        $ref: '#/definitions/types.SettingsOperation'
        x-nullable: true
  types.SettingsRequest:
    type: object
    additionalProperties: false
    required: [settings, revision]
    properties:
      settings: {$ref: '#/definitions/types.GeneralSettings'}
      revision: {type: string}
      allow_dns_restart:
        type: boolean
        default: true
        description: >-
          Set false when the preview did not require a DNS restart. The server
          rejects an operation that would need a restart instead of silently
          escalating it. Omission preserves compatibility with older clients.
  types.SettingsPreviewRequest:
    type: object
    additionalProperties: false
    required: [settings, revision]
    properties:
      settings: {$ref: '#/definitions/types.GeneralSettings'}
      revision: {type: string}
  types.SettingsPreview:
    type: object
    required: [dns_restart_required]
    properties:
      dns_restart_required:
        type: boolean
        description: Whether applying these values requires recreating the DNS runtime.
  types.SettingsAccepted:
    type: object
    required: [operation, target_revision, next_web]
    properties:
      operation: {$ref: '#/definitions/types.SettingsOperation'}
      target_revision: {type: string}
      next_web:
        type: object
        required: [enabled, address, port, auth_enabled]
        properties:
          enabled: {type: boolean}
          address: {type: string}
          port: {type: integer, minimum: 1, maximum: 65535}
          auth_enabled: {type: boolean}
  types.SettingsError:
    type: object
    required: [error, code]
    properties:
      error: {type: string}
      code: {type: string}
      field:
        type: string
        description: Invalid field path, when available.
  types.UpdateInfoRes:
    type: object
    required: [installed_version, installed_revision, asset_suffix, can_install, reason]
    properties:
      installed_version: {type: string, example: '0.8.2.2'}
      installed_revision: {type: integer, minimum: 1, example: 1}
      asset_suffix: {type: string, example: entware_aarch64-3.10_kn.ipk}
      can_install: {type: boolean}
      reason: {type: string}
  types.UpdateInstallReq:
    type: object
    additionalProperties: false
    required: [tag, release_id, preview]
    properties:
      tag: {type: string, example: '0.8.3'}
      release_id: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      preview: {type: boolean}
  types.UpdateAcceptedRes:
    type: object
    required: [job_id, stage]
    properties:
      job_id:
        type: string
        pattern: '^[0-9a-f]{32}$'
      stage:
        type: string
        enum: [queued]
  types.UpdateStatusRes:
    type: object
    required: [stage]
    properties:
      stage:
        type: string
        enum: [idle, queued, checking, downloading, verifying, installing, failed]
      job_id:
        type: string
        pattern: '^[0-9a-f]{32}$'
      external:
        type: boolean
        description: True when a system installer holds the lock after daemon restart; job_id is absent.
      tag: {type: string}
      target_version: {type: string}
      target_revision: {type: integer}
      error: {type: string}
  types.RuleReq:
    properties:
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      name:
        example: Example Domain
        type: string
      rule:
        example: example.com
        type: string
      type:
        example: domain
        type: string
    type: object
  types.RuleRes:
    properties:
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      name:
        example: Example Domain
        type: string
      rule:
        example: example.com
        type: string
      type:
        example: domain
        type: string
    type: object
  types.RulesRes:
    properties:
      rules:
        items:
          $ref: '#/definitions/types.RuleRes'
        type: array
    type: object
info:
  contact: {}
  description: >-
    Groups and subscriptions accept and return priority, an integer from 1 to
    999 inclusive. Higher values take precedence when routing. A newly created
    group defaults to 300, and a subscription to 100. Omitting priority when
    updating an existing object preserves its current value. Explicit null,
    nonnumeric, fractional, duplicate or out-of-range priorities return HTTP 400
    before applying the request. The same defaults apply when loading a legacy
    YAML configuration without priority fields.
  title: MagiTrickle API
  version: "0.1"
paths:
  /api/v1/adaptive:
    get:
      summary: Read adaptive TCP routing settings and runtime state
      description: >-
        Authenticated, no-store response. The optional mode handles new TCP/80
        and TCP/443 flows from selected LAN interfaces. Learning records path
        progress, not certificate validity or successful page delivery.
      tags: [adaptive]
      produces: [application/json]
      responses:
        '200':
          description: Current settings, runtime status, interface inventory and transient route cache
          schema: {$ref: '#/definitions/types.AdaptiveState'}
        '401': {description: WebUI authentication required when enabled}
        '503': {description: Cannot read runtime state}
    put:
      summary: Apply and persist the complete adaptive TCP settings
      description: >-
        Same-origin JSON; at most 8192 bytes. Unknown, missing, duplicate or
        invalid fields return 400. Existing manual routing and Keenetic policy
        scope retain precedence. Changing settings closes active relay flows
        and clears transient entries, without restarting DNS. Activation
        failure attempts to restore previous settings and returns actual
        runtime status. A persistence failure after application returns
        applied=true; retrying identical settings does not restart a healthy
        runtime. A saved enabled but inactive configuration can be resubmitted
        to retry activation. General settings operations take precedence.
      tags: [adaptive]
      consumes: [application/json]
      produces: [application/json]
      parameters:
      - in: body
        name: json
        required: true
        schema:
          type: object
          additionalProperties: false
          required: [settings]
          properties:
            settings: {$ref: '#/definitions/types.AdaptiveSettings'}
      responses:
        '200':
          description: Settings applied and saved
          schema: {$ref: '#/definitions/types.AdaptiveState'}
        '400':
          description: INVALID_SETTINGS
          schema: {$ref: '#/definitions/types.AdaptiveState'}
        '401': {description: WebUI authentication required when enabled}
        '409':
          description: SETTINGS_BUSY
          schema: {$ref: '#/definitions/types.AdaptiveState'}
        '500':
          description: PERSISTENCE_FAILED; applied=true and current settings returned
          schema: {$ref: '#/definitions/types.AdaptiveState'}
        '503':
          description: TPROXY_UNAVAILABLE, or cannot read runtime state
          schema: {$ref: '#/definitions/types.AdaptiveState'}
  /api/v1/adaptive/cache:
    delete:
      summary: Clear transient adaptive route decisions
      description: Authenticated, no-store response. Current relay flows and their connection pinning remain intact.
      tags: [adaptive]
      produces: [application/json]
      responses:
        '200':
          description: Cache cleared
          schema: {$ref: '#/definitions/types.AdaptiveState'}
        '401': {description: WebUI authentication required when enabled}
        '503':
          description: CACHE_UNAVAILABLE, or cannot read runtime state
          schema: {$ref: '#/definitions/types.AdaptiveState'}
  /api/v1/groups:
    get:
      description: Возвращает список групп
      parameters:
      - description: Возвращать группы с их правилами
        in: query
        name: with_rules
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.GroupsRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: Получить список групп
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Создает группу
      parameters:
      - description: Сохранить изменения в конфигурационный файл
        in: query
        name: save
        type: boolean
      - description: Тело запроса
        in: body
        name: json
        required: true
        schema:
          $ref: '#/definitions/types.GroupReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.GroupRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "409":
          description: Conflict - идентификатор уже используется группой или подпиской
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: Создать группу
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Обновляет список групп
      parameters:
      - description: Сохранить изменения в конфигурационный файл
        in: query
        name: save
        type: boolean
      - description: Тело запроса
        in: body
        name: json
        required: true
        schema:
          $ref: '#/definitions/types.GroupsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.GroupsRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "409":
          description: Conflict - повторяющиеся идентификаторы групп или совпадение с подпиской
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: Обновить список групп
      tags:
      - groups
  /api/v1/groups/{groupID}:
    delete:
      description: Удаляет запрошенную группу
      parameters:
      - description: ID группы
        in: path
        name: groupID
        required: true
        type: string
      - description: Сохранить изменения в конфигурационный файл
        in: query
        name: save
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: Удалить группу
      tags:
      - groups
    get:
      description: Возвращает запрошенную группу
      parameters:
      - description: ID группы
        in: path
        name: groupID
        required: true
        type: string
      - description: Возвращать группу с её правилами
        in: query
        name: with_rules
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.GroupRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: Получить группу
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Обновляет запрошенную группу
      parameters:
      - description: ID группы
        in: path
        name: groupID
        required: true
        type: string
      - description: Сохранить изменения в конфигурационный файл
        in: query
        name: save
        type: boolean
      - description: Тело запроса
        in: body
        name: json
        required: true
        schema:
          $ref: '#/definitions/types.GroupReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.GroupRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: Обновить группу
      tags:
      - groups
  /api/v1/groups/{groupID}/rules:
    get:
      description: Возвращает список правил
      parameters:
      - description: ID группы
        in: path
        name: groupID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.RulesRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: Получить список правил
      tags:
      - rules
    post:
      consumes:
      - application/json
      description: Создает правило
      parameters:
      - description: ID группы
        in: path
        name: groupID
        required: true
        type: string
      - description: Сохранить изменения в конфигурационный файл
        in: query
        name: save
        type: boolean
      - description: Тело запроса
        in: body
        name: json
        required: true
        schema:
          $ref: '#/definitions/types.RuleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.RuleRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: Создать правило
      tags:
      - rules
    put:
      consumes:
      - application/json
      description: Обновляет список правил
      parameters:
      - description: ID группы
        in: path
        name: groupID
        required: true
        type: string
      - description: Сохранить изменения в конфигурационный файл
        in: query
        name: save
        type: boolean
      - description: Тело запроса
        in: body
        name: json
        required: true
        schema:
          $ref: '#/definitions/types.RulesRes'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/types.RulesRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/types.ErrorRes'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/types.ErrorRes'
      summary: Обновить список правил
      tags:
      - rules
  /api/v1/groups/{groupID}/rules/{ruleID}:
    delete:
      description: Удаляет запрошенное правило
      parameters:
      - description: ID группы
        in: path
        name: groupID
        required: true
        type: string
      - description: ID правила
        in: path
        name: ruleID
        required: true
        type: string
      - description: Сохранить изменения в конфигурационный файл
        in: query
        name: save
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
