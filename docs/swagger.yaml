  /api/v1/system/ready:
    get:
      summary: Check whether local DNS routing initialization has completed
      description: >-
        Read-only and not cached. Available in the normal runtime over the
        administrative Unix socket and the authenticated WebUI API. Readiness
        requires a running application and no queued or in-flight netfilter
        application. On Keenetic, the current policy generation must be applied
        successfully and an enabled policy must have an initial validated RCI
        resolution. Disabled filtering needs no RCI response. Validated absent
        or unmarked policies preserve their configured traffic scope. This
        check does not depend on optional DNS history, perform RCI requests or
        guarantee Internet connectivity. Both 200 and 503 have empty bodies.
      responses:
        "200":
          description: Local initialization and current routing application are complete
          headers:
            Cache-Control:
              type: string
              description: Always no-store
        "401":
          description: WebUI authentication required when enabled
        "404":
          description: The normal runtime API is unavailable in settings-only recovery
        "503":
          description: Runtime initialization or routing application is pending or failed
          headers:
            Cache-Control:
              type: string
              description: Always no-store
      tags: [system]
  /api/v1/system/settings:
    get:
      summary: Read editable application settings and the last apply result
      description: >-
        Read-only, authenticated and not cached. Returns settings from the running
        configuration, an app-only revision and the last volatile apply operation.
        An applying operation is not a successful save. Confirmation requires the
        expected operation ID, succeeded state and target revision. Enabling
        authentication can require a new login before this response is accessible.
      produces: [application/json]
      responses:
        "200":
          description: Current configuration settings and operation status
          schema: {$ref: '#/definitions/types.SettingsSnapshot'}
        "401":
          description: Authentication required
        "500":
          description: Settings could not be read
          schema: {$ref: '#/definitions/types.SettingsError'}
        "503":
          description: Settings controller is unavailable
          schema: {$ref: '#/definitions/types.SettingsError'}
      tags: [config]
    put:
      summary: Save and immediately apply application settings
      description: >-
        Requires same-origin JSON, the complete allowed settings projection and the
        revision from GET. Unknown fields and invalid types/ranges are rejected.
        Application is queued only after a successful acknowledgement write.
        Preview determines whether the change requires a DNS runtime restart.
        Live changes atomically persist before updating existing runtime components;
        WebUI enable/disable replaces only the HTTP listener after the ACK is
        flushed and does not interrupt DNS. Other changes recreate the runtime,
        preserving current collections and DNS cache, then atomically save the
        canonical YAML. Only the latter can temporarily interrupt DNS routing.
        Set allow_dns_restart to false after a preview that did not require one;
        a changed runtime state must not silently escalate the operation. Startup
        or persistence failures preserve or restore the previous settings; failed
        restoration is a distinct operation result. GET confirms completion.
        For changed HTTP address/port use next_web to construct a new browser
        URL; wildcard addresses mean the browser's current host. Do not forward
        credentials across origins. Disabling HTTP removes browser access to the
        final result. No separate manual restart request is needed.
      consumes: [application/json]
      produces: [application/json]
      parameters:
      - in: body
        name: json
        required: true
        schema: {$ref: '#/definitions/types.SettingsRequest'}
      responses:
        "200":
          description: Settings are unchanged and already active; no runtime restart
          schema: {$ref: '#/definitions/types.SettingsAccepted'}
        "202":
          description: Accepted for application; not yet confirmed saved or active
          schema: {$ref: '#/definitions/types.SettingsAccepted'}
        "400":
          description: Invalid settings or request; field identifies the invalid input when available
          schema: {$ref: '#/definitions/types.SettingsError'}
        "401":
          description: Authentication required
        "409":
          description: Stale revision, another operation in progress, or SETTINGS_RESTART_REQUIRED when a restart was not allowed
          schema: {$ref: '#/definitions/types.SettingsError'}
        "500":
          description: Preparation failed before acceptance
          schema: {$ref: '#/definitions/types.SettingsError'}
        "503":
          description: Persistence or runtime application is unavailable
          schema: {$ref: '#/definitions/types.SettingsError'}
      tags: [config]
  /api/v1/system/settings/preview:
    post:
      summary: Check whether changed application settings require a DNS restart
      description: >-
        Authenticated, same-origin JSON and not cached. Uses the same strict
        settings validation and revision check as PUT. Returns the actual
        application impact, including recovery when the current runtime no
        longer matches the configuration. It does not write configuration,
        reserve an operation, resolve DNS or restart components. A preview is
        not a reservation; pass allow_dns_restart to PUT to enforce the approved
        impact if runtime state changes before application.
      consumes: [application/json]
      produces: [application/json]
      parameters:
      - in: body
        name: json
        required: true
        schema: {$ref: '#/definitions/types.SettingsPreviewRequest'}
      responses:
        "200":
          description: Current application impact for the supplied settings
          schema: {$ref: '#/definitions/types.SettingsPreview'}
        "400":
