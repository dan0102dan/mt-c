definitions:
  types.ErrorRes:
    properties:
      error:
        example: something went wrong
        type: string
    type: object
  types.GroupReq:
    properties:
      color:
        example: '#ffffff'
        type: string
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      interface:
        example: nwg0
        type: string
      name:
        example: Routing
        type: string
      priority:
        description: Higher values take precedence when routing. Omission uses 300 for a new group and preserves the current value when updating an existing group.
        type: integer
        minimum: 1
        maximum: 999
        default: 300
        example: 300
      rules:
        items:
          $ref: '#/definitions/types.RuleReq'
        type: array
    type: object
  types.GroupRes:
    properties:
      color:
        example: '#ffffff'
        type: string
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      interface:
        example: nwg0
        type: string
      name:
        example: Routing
        type: string
      priority:
        description: Routing priority; higher values take precedence.
        type: integer
        minimum: 1
        maximum: 999
        example: 300
      rules:
        items:
          $ref: '#/definitions/types.RuleRes'
        type: array
    type: object
  types.GroupsReq:
    properties:
      groups:
        items:
          $ref: '#/definitions/types.GroupReq'
        type: array
    type: object
  types.GroupsRes:
    properties:
      groups:
        items:
          $ref: '#/definitions/types.GroupRes'
        type: array
    type: object
  types.InterfaceRes:
    properties:
      id:
        example: nwg0
        type: string
    type: object
  types.InterfacesRes:
    properties:
      interfaces:
        items:
          $ref: '#/definitions/types.InterfaceRes'
        type: array
    type: object
  types.NetfilterDHookReq:
    properties:
      table:
        example: nat
        type: string
      type:
        example: iptables
        type: string
    type: object
  types.SettingsEndpoint:
    type: object
    additionalProperties: false
    required: [address, port]
    properties:
      address: {type: string, minLength: 1, example: '[::]'}
      port: {type: integer, minimum: 1, maximum: 65535}
  types.GeneralSettings:
    type: object
    additionalProperties: false
    required: [httpWeb, dnsProxy, netfilter, link, showAllInterfaces, logLevel]
    description: >-
      The complete editable application settings projection. Collection data,
      Keenetic policy, skin, chain/table prefixes and mark-table index are not
      accepted here and are preserved from the latest running configuration.
    properties:
      httpWeb:
        type: object
        additionalProperties: false
        required: [enabled, auth, host]
        properties:
          enabled: {type: boolean}
          auth:
            type: object
            additionalProperties: false
            required: [enabled]
            properties:
              enabled: {type: boolean}
          host: {$ref: '#/definitions/types.SettingsEndpoint'}
      dnsProxy:
        type: object
        additionalProperties: false
        required: [host, upstream, disableRemap53, disableFakePTR, disableDropAAAA, maxIdleConns, maxConcurrent, timeoutMs]
        properties:
          host: {$ref: '#/definitions/types.SettingsEndpoint'}
          upstream: {$ref: '#/definitions/types.SettingsEndpoint'}
          disableRemap53: {type: boolean}
          disableFakePTR: {type: boolean}
          disableDropAAAA: {type: boolean}
          maxIdleConns: {type: integer, minimum: 0, maximum: 4294967295}
          maxConcurrent: {type: integer, minimum: 1, maximum: 4294967295}
          timeoutMs:
            type: integer
            minimum: 1
            maximum: 4294967295
            description: Upstream request timeout in milliseconds.
      netfilter:
        type: object
        additionalProperties: false
        required: [disableIPv4, disableIPv6, ipset]
        properties:
          disableIPv4: {type: boolean}
          disableIPv6: {type: boolean}
          ipset:
            type: object
            additionalProperties: false
            required: [additionalTTLSeconds]
            properties:
              additionalTTLSeconds:
                type: integer
                minimum: 0
                maximum: 4294967295
                description: Extra lifetime added to DNS-derived IP entries, in seconds.
      link:
        type: array
        uniqueItems: true
        description: Interface names used to collect local addresses for DNS port interception.
        items: {type: string, minLength: 1}
      showAllInterfaces: {type: boolean}
      logLevel:
        type: string
        enum: [trace, debug, info, warn, error, fatal, panic, nolevel, disabled]
  types.SettingsOperation:
    type: object
    required: [id, state, target_revision]
    properties:
      id: {type: string}
      state:
        type: string
        enum: [applying, succeeded, failed, rollback_failed]
      target_revision: {type: string}
      error: {type: string}
  types.SettingsSnapshot:
    type: object
    required: [settings, revision, operation]
    properties:
      settings: {$ref: '#/definitions/types.GeneralSettings'}
      revision:
        type: string
        description: Opaque revision over the editable application settings only.
      operation:
        $ref: '#/definitions/types.SettingsOperation'
        x-nullable: true
  types.SettingsRequest:
    type: object
    additionalProperties: false
    required: [settings, revision]
    properties:
      settings: {$ref: '#/definitions/types.GeneralSettings'}
      revision: {type: string}
      allow_dns_restart:
        type: boolean
        default: true
        description: >-
          Set false when the preview did not require a DNS restart. The server
          rejects an operation that would need a restart instead of silently
          escalating it. Omission preserves compatibility with older clients.
  types.SettingsPreviewRequest:
    type: object
    additionalProperties: false
    required: [settings, revision]
    properties:
      settings: {$ref: '#/definitions/types.GeneralSettings'}
      revision: {type: string}
  types.SettingsPreview:
    type: object
    required: [dns_restart_required]
    properties:
      dns_restart_required:
        type: boolean
        description: Whether applying these values requires recreating the DNS runtime.
  types.SettingsAccepted:
    type: object
    required: [operation, target_revision, next_web]
    properties:
      operation: {$ref: '#/definitions/types.SettingsOperation'}
      target_revision: {type: string}
      next_web:
        type: object
        required: [enabled, address, port, auth_enabled]
        properties:
          enabled: {type: boolean}
          address: {type: string}
          port: {type: integer, minimum: 1, maximum: 65535}
          auth_enabled: {type: boolean}
  types.SettingsError:
    type: object
    required: [error, code]
    properties:
      error: {type: string}
      code: {type: string}
      field:
        type: string
        description: Invalid field path, when available.
  types.UpdateInfoRes:
    type: object
    required: [installed_version, installed_revision, asset_suffix, can_install, reason]
    properties:
      installed_version: {type: string, example: '0.8.2.2'}
      installed_revision: {type: integer, minimum: 1, example: 1}
      asset_suffix: {type: string, example: entware_aarch64-3.10_kn.ipk}
      can_install: {type: boolean}
      reason: {type: string}
  types.UpdateInstallReq:
    type: object
    additionalProperties: false
    required: [tag, release_id, preview]
    properties:
      tag: {type: string, example: '0.8.3'}
      release_id: {type: integer, format: int64, minimum: 1, maximum: 9007199254740991}
      preview: {type: boolean}
  types.UpdateAcceptedRes:
    type: object
    required: [job_id, stage]
    properties:
      job_id:
        type: string
        pattern: '^[0-9a-f]{32}$'
      stage:
        type: string
        enum: [queued]
  types.UpdateStatusRes:
    type: object
    required: [stage]
    properties:
      stage:
        type: string
        enum: [idle, queued, checking, downloading, verifying, installing, failed]
      job_id:
        type: string
        pattern: '^[0-9a-f]{32}$'
      external:
        type: boolean
        description: True when a system installer holds the lock after daemon restart; job_id is absent.
      tag: {type: string}
      target_version: {type: string}
      target_revision: {type: integer}
      error: {type: string}
  types.RuleReq:
    properties:
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      name:
        example: Example Domain
        type: string
      rule:
        example: example.com
        type: string
      type:
        example: domain
        type: string
    type: object
  types.RuleRes:
    properties:
      enable:
        example: true
        type: boolean
      id:
        example: 0a1b2c3d
        type: string
      name:
        example: Example Domain
        type: string
      rule:
        example: example.com
        type: string
      type:
        example: domain
        type: string
    type: object
  types.RulesRes:
    properties:
      rules:
        items:
          $ref: '#/definitions/types.RuleRes'
        type: array
    type: object
info:
  contact: {}
  description: >-
    Groups and subscriptions accept and return priority, an integer from 1 to
    999 inclusive. Higher values take precedence when routing. A newly created
    group defaults to 300, and a subscription to 100. Omitting priority when
    updating an existing object preserves its current value. Explicit null,
    nonnumeric, fractional, duplicate or out-of-range priorities return HTTP 400
    before applying the request. The same defaults apply when loading a legacy
    YAML configuration without priority fields.
  title: MagiTrickle API
  version: "0.1"
